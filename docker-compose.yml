services:
  api:
    build: .
    container_name: vinted-api
    restart: always
    command: ["./api"]
    environment:
      - DATABASE_URL=postgres://vinted:vinted@postgres:5432/vinted?sslmode=disable
      - API_TOKEN=${API_TOKEN:-}
      - API_PORT=8080
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  worker:
    build: .
    container_name: vinted-worker
    restart: always
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SEARCH_QUERY=${SEARCH_QUERY}
      - VINTED_BASE_URL=${VINTED_BASE_URL:-https://www.vinted.de}
      - CATALOG_IDS=${CATALOG_IDS:-}
      - SIZE_IDS=${SIZE_IDS:-}
      - BRAND_IDS=${BRAND_IDS:-}
      - CURRENCY=${CURRENCY:-EUR}
      - MIN_PRICE=${MIN_PRICE:-0}
      - MAX_PRICE=${MAX_PRICE}
      - RATE_LIMIT_MS=${RATE_LIMIT_MS:-15000}
      - REDIS_ADDR=redis:6379
      - DATABASE_URL=postgres://vinted:vinted@postgres:5432/vinted?sslmode=disable
    depends_on:
      - redis
      - postgres
      - api
    # volumes:
    #   - ./logs:/app/logs

  redis:
    image: redis:alpine
    container_name: vinted-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: vinted-postgres
    restart: always
    environment:
      POSTGRES_USER: vinted
      POSTGRES_PASSWORD: vinted
      POSTGRES_DB: vinted
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  redis_data:
  postgres_data:
