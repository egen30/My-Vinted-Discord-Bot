services:
  worker:
    build: .
    container_name: vinted-worker
    restart: always
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SEARCH_QUERY=${SEARCH_QUERY}
      - VINTED_BASE_URL=${VINTED_BASE_URL:-https://www.vinted.de}
      - CATALOG_IDS=${CATALOG_IDS:-}
      - SIZE_IDS=${SIZE_IDS:-}
      - BRAND_IDS=${BRAND_IDS:-}
      - CURRENCY=${CURRENCY:-EUR}
      - MIN_PRICE=${MIN_PRICE:-0}
      - MAX_PRICE=${MAX_PRICE}
      - RATE_LIMIT_MS=${RATE_LIMIT_MS:-15000}
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    # volumes:
    #   - ./logs:/app/logs

  redis:
    image: redis:alpine
    container_name: vinted-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
